{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container" style="max-width:760px">
  <div class="page-head"><h1>{{ title }}</h1></div>
  <div class="card-ih p-4">
    <p class="mb-3" style="white-space:pre-line">{{ message }}</p>
    <div class="d-flex gap-2 flex-wrap">
      <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
      {% if show_health %}<a class="btn btn-outline-primary" href="{{ url_for('health') }}">Check system status</a>{% endif %}
    </div>
  </div>
</div>
{% endblock %}
